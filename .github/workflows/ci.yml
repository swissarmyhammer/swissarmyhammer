name: CI

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # NOTE: the self-hosted runner is a Mac WITH a Metal GPU, so the Test job runs
  # on the GPU (the embedding stack defaults to offloading all layers). This is
  # required by the Metal-offload proof test and keeps the real-model tests fast
  # enough to stay well under their hang-guards. Do NOT set LLAMA_N_GPU_LAYERS=0
  # here — CPU-forced real-model inference is dramatically slower.

jobs:
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The `missing-docs-rust` and `complexity-rust` tool rules check
          # `which cargo-clippy jq`, and their tests state that tool as a
          # precondition rather than installing it. A job states the components
          # it needs, the same way the Clippy and Rustfmt jobs do.
          components: clippy
      - name: Install rust-analyzer
        run: rustup component add rust-analyzer
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "swissarmyhammer-ci"
      - uses: taiki-e/install-action@nextest
      - name: Ensure Chromium is available
        run: |
          if ! command -v chromium &>/dev/null && ! [ -d "/Applications/Chromium.app" ] && ! [ -d "/Applications/Google Chrome.app" ]; then
            brew install --cask chromium --no-quarantine
          fi
      - name: Ensure jq is available
        # The second half of the `which cargo-clippy jq` doctor check above.
        run: |
          if ! command -v jq &>/dev/null; then
            brew install jq
          fi
      - name: Install vulture
        # The tool `dead-code-python` requires, at the version that rule pins.
        # `uv` is not part of this runner's contract, so install it the way the
        # step above installs Chromium. `uv tool install` links executables into
        # a bin directory that is not on the runner PATH by default, so state it
        # for the steps that follow. Both commands are no-ops when the pinned
        # version is already there.
        run: |
          if ! command -v uv &>/dev/null; then
            brew install uv
          fi
          uv tool install vulture==2.14
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install cargo-machete
        # The tool `unused-dependencies-rust` requires, installed by the command
        # that rule declares. Cargo skips the build when the pinned version is
        # already installed.
        run: cargo install cargo-machete@0.9.2 --locked
      - name: Run tests
        run: cargo nextest run --no-fail-fast

  frontend:
    name: Frontend
    needs: test
    runs-on: self-hosted
    strategy:
      matrix:
        app: [apps/kanban-app, apps/mirdan-app]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "swissarmyhammer-ci"
      - name: Build kanban CLI (needed by browser integration tests)
        run: cargo build -p kanban-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: ${{ matrix.app }}/ui
        # `npm ci` installs the exact committed lockfile — deterministic, immune
        # to a freshly-published transitive dep breaking a green build.
        run: |
          npm ci
          rm -rf node_modules/.vite
      - name: Install Playwright browsers
        working-directory: ${{ matrix.app }}/ui
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: ${{ matrix.app }}/ui
        run: npx tsc --noEmit
      - name: Test
        working-directory: ${{ matrix.app }}/ui
        run: npm test --if-present

  apps:
    name: Tauri Apps
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "swissarmyhammer-ci"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked || true
      - uses: taiki-e/install-action@just
      - name: Build Tauri apps
        # Runs the same just recipe developers use, so a broken app build
        # (e.g. mismatched tauri / @tauri-apps/api versions) fails CI instead
        # of slipping through to release. The justfile owns the app list --
        # adding an app there is enough, no CI edit needed.
        #
        # APPLE_SIGNING_IDENTITY="-" forces ad-hoc signing, which needs no
        # keychain identity. It overrides the real Developer ID in each app's
        # tauri.conf.json so this job verifies the build compiles and bundles
        # without depending on signing certs. Release signing is handled by
        # the separate Release App workflow.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: just build

  fmt:
    name: Rustfmt
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "swissarmyhammer-ci"
      - name: Linting
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Docs Guard
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Guard against removed prompts feature in docs
        run: ./scripts/docs_no_prompts_guard.sh

  examples:
    name: Run all examples
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "swissarmyhammer-ci"
      - name: Build examples
        run: |
          cargo metadata --format-version 1 \
            | jq -r '
                .workspace_members as $members
                | .packages[]
                | select(.id as $id | $members | index($id))
                | .name as $pkg
                | .targets[]
                | select(.kind[] == "example")
                | "\($pkg) \(.name)"
              ' \
            | while read -r pkg name; do
                echo "::group::Running example: $pkg/$name"
                cargo build --example "$name" -p "$pkg"
                echo "::endgroup::"
              done

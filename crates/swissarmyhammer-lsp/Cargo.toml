[package]
name = "swissarmyhammer-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
swissarmyhammer-project-detection = { workspace = true }
lsp-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
which = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
include_dir = { workspace = true }

[features]
# Exposes `swissarmyhammer_lsp::test_support` (the in-memory `FakeTransport`) to
# the tests of other crates, so they share one fake LSP transport instead of
# each writing a copy. This crate's own tests compile the module without the
# feature. No extra dependencies.
test-support = []

[dev-dependencies]
swissarmyhammer-leader-election = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
tracing-test = { workspace = true }
